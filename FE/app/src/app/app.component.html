<!-- Accessible skip link for keyboard & assistive tech navigation -->
<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="app-shell d-flex flex-column min-vh-100">
  <!-- Top Application Header -->
  <app-header
    appTitle="ApexCellular POS"
    [sidebarOpen]="sidebarOpen"
    [sidebarCollapsed]="sidebarCollapsed"
    [apiConnected]="apiConnected"
    [apiChecking]="apiChecking"
    [activeShopId]="activeShopId"
    (toggleSidebar)="toggleSidebar()"
    (toggleCollapse)="toggleCollapse()"
  ></app-header>

  <!-- Shell Layout: Sidebar + Main Content -->
  <div class="app-layout d-flex flex-grow-1 position-relative">
    <app-sidebar
      [isOpen]="sidebarOpen"
      [isCollapsed]="sidebarCollapsed"
      [activeShopId]="activeShopId"
      (closeSidebar)="closeSidebar()"
    ></app-sidebar>

    <!-- Mobile sidebar overlay backdrop -->
    <div
      *ngIf="sidebarOpen"
      class="sidebar-backdrop d-md-none"
      (click)="closeSidebar()"
      aria-hidden="true"
    ></div>

    <!-- Main Viewport Router Outlet -->
    <main id="main-content" class="app-main flex-grow-1" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Floating Toast Notifications Host -->
<app-toast-container></app-toast-container>
