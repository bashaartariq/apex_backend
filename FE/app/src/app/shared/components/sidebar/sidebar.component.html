<aside
  id="app-sidebar"
  class="app-sidebar"
  [class.is-open]="isOpen"
  aria-label="Application navigation"
>
  <div class="sidebar-header d-flex align-items-center justify-content-between p-3 border-bottom border-secondary">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-cpu text-primary fs-4" aria-hidden="true"></i>
      <div>
        <div class="fw-bold text-light">Mobile POS Suite</div>
        <small class="text-secondary">Multi-Tenant Core</small>
      </div>
    </div>
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary d-md-none text-light border-0"
      (click)="closeSidebar.emit()"
      aria-label="Close navigation menu"
    >
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  </div>

  <nav aria-label="Primary" class="p-3">
    <div class="text-uppercase text-muted fw-bold small mb-2 px-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">
      Modules & Navigation
    </div>
    <ul class="nav flex-column gap-1 list-unstyled mb-0">
      <li *ngFor="let item of navItems" class="nav-item">
        <a
          *ngIf="!item.isPlaceholder; else placeholderLink"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onNavigate()"
          class="nav-link d-flex align-items-center justify-content-between rounded px-3 py-2 text-decoration-none"
        >
          <span class="d-flex align-items-center gap-2">
            <i class="bi" [ngClass]="item.icon" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </span>
          <span class="badge bg-success text-white small" *ngIf="item.stageBadge">
            {{ item.stageBadge }}
          </span>
        </a>

        <ng-template #placeholderLink>
          <div
            class="nav-link placeholder-item d-flex align-items-center justify-content-between rounded px-3 py-2 text-decoration-none text-muted"
            aria-disabled="true"
            title="Scheduled for implementation in later steps"
          >
            <span class="d-flex align-items-center gap-2">
              <i class="bi" [ngClass]="item.icon" aria-hidden="true"></i>
              <span>{{ item.label }}</span>
            </span>
            <span class="badge bg-secondary text-light small" *ngIf="item.stageBadge">
              {{ item.stageBadge }}
            </span>
          </div>
        </ng-template>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer mt-auto p-3 border-top border-secondary text-secondary small">
    <div class="d-flex align-items-center gap-2 mb-1">
      <i class="bi bi-database text-info" aria-hidden="true"></i>
      <span class="text-light fw-semibold">SQLite Shared DB</span>
    </div>
    <div class="small">Tenant isolation via <code class="text-info font-monospace">shop_id</code></div>
  </div>
</aside>
