<aside
  id="app-sidebar"
  class="app-sidebar"
  [class.is-open]="isOpen"
  [class.is-collapsed]="isCollapsed"
  aria-label="Application navigation"
>
  <!-- Sidebar Header / Brand Logo -->
  <div class="sidebar-header d-flex align-items-center justify-content-between p-3 border-bottom border-dark">
    <a routerLink="/dashboard" class="d-flex align-items-center gap-2 text-decoration-none" (click)="onNavigate()">
      <div class="brand-logo-box rounded d-flex align-items-center justify-content-center text-white bg-primary flex-shrink-0">
        <i class="bi bi-phone-fill fs-5" aria-hidden="true"></i>
      </div>
      <div class="brand-text-block" *ngIf="!isCollapsed">
        <div class="fw-bold text-white lh-1 brand-name">ApexCellular</div>
        <small class="text-muted text-uppercase" style="font-size: 0.65rem; letter-spacing: 0.05em;">POS &amp; Inventory Suite</small>
      </div>
    </a>

    <!-- Mobile close drawer button -->
    <button
      type="button"
      class="btn btn-sm text-secondary d-md-none border-0 p-1"
      (click)="closeSidebar.emit()"
      aria-label="Close navigation menu"
    >
      <i class="bi bi-x-lg fs-5" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Navigation Items -->
  <nav aria-label="Primary" class="sidebar-nav flex-grow-1 p-2" tabindex="-1">
    <div *ngFor="let section of navSections" class="nav-section mb-3">
      <div *ngIf="section.title && !isCollapsed" class="nav-section-title px-2 mb-1">
        {{ section.title }}
      </div>

      <ul class="nav flex-column gap-1 list-unstyled mb-0">
        <li *ngFor="let item of section.items" class="nav-item">
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            (click)="onNavigate()"
            class="nav-link d-flex align-items-center rounded text-decoration-none"
            [class.justify-content-center]="isCollapsed"
            [class.px-2]="isCollapsed"
            [class.px-3]="!isCollapsed"
            [title]="isCollapsed ? item.label : ''"
          >
            <i class="bi nav-icon flex-shrink-0" [ngClass]="item.icon" aria-hidden="true"></i>
            <span class="nav-label flex-grow-1 ms-2 text-truncate" *ngIf="!isCollapsed">
              {{ item.label }}
            </span>
            <span
              *ngIf="item.badge && !isCollapsed"
              class="badge rounded-pill small ms-1"
              [ngClass]="item.badgeColor || 'bg-secondary'"
              style="font-size: 0.6875rem;"
            >
              {{ item.badge }}
            </span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar Footer / Store Identity info -->
  <div class="sidebar-footer p-3 border-top border-dark text-secondary mt-auto" *ngIf="!isCollapsed">
    <div class="d-flex align-items-center gap-2 mb-1">
      <i class="bi bi-shop text-primary fs-5" aria-hidden="true"></i>
      <div class="overflow-hidden">
        <div class="text-light small fw-bold text-truncate">Downtown Store #1</div>
        <div class="small text-muted font-monospace" style="font-size: 0.6875rem;">{{ activeShopId || 'SHOP-DOWNTOWN-01' }}</div>
      </div>
    </div>
    <div class="d-flex align-items-center justify-content-between pt-2 border-top border-dark mt-2" style="font-size: 0.7rem;">
      <span class="text-muted">v1.2.0 &middot; SaaS Enterprise</span>
      <span class="text-success d-flex align-items-center gap-1">
        <span class="status-dot-sm bg-success rounded-circle"></span> Online
      </span>
    </div>
  </div>

  <div class="sidebar-footer-collapsed p-2 text-center border-top border-dark mt-auto" *ngIf="isCollapsed">
    <span class="status-dot-sm bg-success rounded-circle d-inline-block" title="System Online"></span>
  </div>
</aside>
