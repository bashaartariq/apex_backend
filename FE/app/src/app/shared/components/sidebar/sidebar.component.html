<aside
  id="app-sidebar"
  class="app-sidebar"
  [class.is-open]="isOpen"
  [class.is-collapsed]="isCollapsed"
  aria-label="Application navigation"
>
  <!-- Sidebar Header / Signature Platform Mark -->
  <div class="sidebar-header d-flex align-items-center justify-content-between px-3">
    <a routerLink="/dashboard" class="d-flex align-items-center gap-2 text-decoration-none overflow-hidden" (click)="onNavigate()">
      <div class="brand-logo-box d-flex align-items-center justify-content-center text-white flex-shrink-0">
        <i class="bi bi-cpu-fill fs-5" aria-hidden="true"></i>
      </div>
      <div class="brand-text-block overflow-hidden" *ngIf="!isCollapsed">
        <div class="fw-bold text-white lh-1 brand-name text-truncate">ApexCellular</div>
        <small class="brand-sub text-uppercase">Retail OS &middot; Enterprise</small>
      </div>
    </a>

    <button
      type="button"
      class="btn btn-sm text-light d-md-none border-0 p-1"
      (click)="closeSidebar.emit()"
      aria-label="Close navigation menu"
    >
      <i class="bi bi-x-lg fs-5" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Quick POS Launch CTA -->
  <div class="px-3 pt-3 pb-1" *ngIf="!isCollapsed && canOpenPos">
    <a routerLink="/pos" class="pos-quick-cta text-decoration-none" (click)="onNavigate()">
      <i class="bi bi-upc-scan"></i>
      <span>New POS Sale</span>
      <kbd>POS</kbd>
    </a>
  </div>

  <!-- Navigation Sections -->
  <nav aria-label="Primary" class="sidebar-nav flex-grow-1 px-2 py-2" tabindex="-1">
    <div *ngFor="let section of navSections; trackBy: trackBySection" class="nav-section mb-3">
      <div *ngIf="section.title && !isCollapsed" class="nav-section-title px-2 mb-1">
        {{ section.title }}
      </div>

      <ul class="nav flex-column gap-1 list-unstyled mb-0">
        <li *ngFor="let item of section.items; trackBy: trackByItem" class="nav-item">
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            (click)="onNavigate()"
            class="nav-link d-flex align-items-center text-decoration-none"
            [class.justify-content-center]="isCollapsed"
            [class.px-2]="isCollapsed"
            [class.px-3]="!isCollapsed"
            [title]="item.description || item.label"
          >
            <i class="bi nav-icon flex-shrink-0" [ngClass]="item.icon" aria-hidden="true"></i>
            <span class="nav-label flex-grow-1 ms-2 text-truncate" *ngIf="!isCollapsed">
              {{ item.label }}
            </span>
            <span
              *ngIf="item.badge && !isCollapsed"
              class="nav-pill-badge ms-1"
              [ngClass]="item.badgeColor || 'badge-brand'"
            >
              {{ item.badge }}
            </span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar Footer / Active Tenant Card -->
  <div class="sidebar-footer p-3 mt-auto" *ngIf="!isCollapsed">
    <div class="tenant-footer-card p-2">
      <div class="d-flex align-items-center gap-2 mb-2">
        <div class="tenant-footer-icon">
          <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
        </div>
        <div class="overflow-hidden">
          <div class="text-white small fw-bold text-truncate lh-sm">{{ auth.currentShop?.name || 'Active Store' }}</div>
          <div class="font-monospace text-truncate" style="color: #64748b; font-size: 0.65rem;">
            {{ auth.currentShop?.id || activeShopId || 'TENANT' }}
          </div>
        </div>
      </div>
      <div class="d-flex align-items-center justify-content-between pt-2 border-top-subtle" style="font-size: 0.68rem;">
        <span style="color: #94a3b8;">{{ auth.currentUser?.role === 'SHOP_ADMIN' ? 'Shop Admin' : 'Shopkeeper' }}</span>
        <span class="text-emerald d-flex align-items-center gap-1 fw-semibold">
          <span class="status-dot-sm rounded-circle"></span> Isolated
        </span>
      </div>
    </div>
  </div>

  <div class="sidebar-footer-collapsed p-3 text-center mt-auto" *ngIf="isCollapsed">
    <span class="status-dot-sm rounded-circle d-inline-block" title="Tenant Isolated & Online"></span>
  </div>
</aside>
