<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ApexCellular POS & Inventory Suite</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="theme-light">
  <app-root>
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Inter, -apple-system, sans-serif; background: #f8fafc; color: #1e293b;">
      <div style="width: 44px; height: 44px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <div style="margin-top: 16px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">ApexCellular POS</div>
      <div style="margin-top: 4px; font-size: 12px; color: #64748b;">Initializing workspace...</div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </app-root>
</body>
</html>
